    <title>Infernix Launcher</title>
    <script>
      // Apply the stored theme before the first paint (no flash of the wrong theme).
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("infernix.theme") || "dark";
        } catch (e) {}
        var dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
