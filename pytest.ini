[pytest]
# The native Python suites (tests/README.md). Run from the repository root:
#   python -m pytest            (add -n auto with pytest-xdist to run them in parallel)
# Suites that need a built probe binary (tests/text, tests/models) and the two artifact interop
# scripts run through CTest instead.
testpaths =
    tests/artifact
    tests/convert
    tests/bench/ttft
    tests/quality
    tests/test_serve_corpus.py
    tests/test_bench_matrix.py
    tests/test_expert_cache_host_tier.py
    tests/test_expert_stripe.py
    tests/test_flash_next_ngram.py
    tests/test_flash_next_tools.py
norecursedirs = .* build build-* out profiles third_party __pycache__
